<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floating Bujo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Segoe UI Variable', system-ui, sans-serif;
            background: #1e1e1e;
            color: #e0e0e0;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-app-region: drag;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 8px;
            gap: 6px;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 8px;
            background: #2d2d2d;
            border-radius: 4px;
            font-size: 12px;
            min-height: 24px;
            -webkit-app-region: drag;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            color: #a0a0a0;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-indicator.error {
            background: #ef4444;
        }

        .status-indicator.warning {
            background: #f59e0b;
        }

        .window-controls {
            display: flex;
            gap: 4px;
            -webkit-app-region: no-drag;
        }

        .control-btn {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 10px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn.minimize {
            background: #f59e0b;
        }

        .control-btn.close {
            background: #ef4444;
        }

        .control-btn:hover {
            opacity: 0.8;
        }

        .input-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        .input-container {
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        #noteInput {
            flex: 1;
            background: #2d2d2d;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 12px;
            color: #e0e0e0;
            font-size: 14px;
            line-height: 1.4;
            resize: none;
            outline: none;
            font-family: inherit;
            min-height: 40px;
            max-height: 200px;
            overflow-y: auto;
            transition: border-color 0.2s ease;
        }

        #noteInput:focus {
            border-color: #0ea5e9;
            box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
        }

        #noteInput::placeholder {
            color: #666;
            font-style: italic;
        }

        .input-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 11px;
            color: #888;
        }

        .keyboard-hints {
            display: flex;
            gap: 12px;
        }

        .hint {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .kbd {
            background: #404040;
            border: 1px solid #555;
            border-radius: 3px;
            padding: 1px 4px;
            font-size: 10px;
            font-family: 'Consolas', 'Courier New', monospace;
        }

        .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .action-btn {
            background: #0ea5e9;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .action-btn:hover {
            background: #0284c7;
        }

        .action-btn:disabled {
            background: #404040;
            color: #888;
            cursor: not-allowed;
        }

        .action-btn.secondary {
            background: #374151;
            color: #d1d5db;
        }

        .action-btn.secondary:hover {
            background: #4b5563;
        }

        .undo-btn {
            background: #f59e0b;
            animation: slideIn 0.3s ease;
        }

        .undo-btn:hover {
            background: #d97706;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .feedback {
            position: absolute;
            top: -30px;
            right: 0;
            background: #10b981;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            animation: fadeInOut 2s ease;
            pointer-events: none;
        }

        .feedback.error {
            background: #ef4444;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateY(5px); }
            20%, 80% { opacity: 1; transform: translateY(0); }
        }

        .mode-indicator {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Scrollbar styling */
        #noteInput::-webkit-scrollbar {
            width: 6px;
        }

        #noteInput::-webkit-scrollbar-track {
            background: #1e1e1e;
            border-radius: 3px;
        }

        #noteInput::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        #noteInput::-webkit-scrollbar-thumb:hover {
            background: #666;
        }

        /* Auto-expand animation */
        .expanding {
            transition: height 0.2s ease;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with status and controls -->
        <div class="header">
            <div class="status-info">
                <div class="status-indicator" id="statusIndicator"></div>
                <span class="mode-indicator" id="modeIndicator">Obsidian Mode</span>
                <span id="statusText">Ready</span>
            </div>
            <div class="window-controls">
                <button class="control-btn minimize" id="minimizeBtn" title="Hide Window">−</button>
                <button class="control-btn close" id="closeBtn" title="Close Application">×</button>
            </div>
        </div>

        <!-- Main input section -->
        <div class="input-section">
            <div class="input-container">
                <textarea 
                    id="noteInput" 
                    placeholder="Entry..."
                    spellcheck="false"
                    autocomplete="off"
                    autofocus></textarea>
                <div id="feedback" class="feedback" style="display: none;"></div>
            </div>

            <div class="input-footer">
                <div class="keyboard-hints">
                    <div class="hint">
                        <span class="kbd">Enter</span>
                        <span>Save</span>
                    </div>
                    <div class="hint">
                        <span class="kbd">Esc</span>
                        <span>Clear</span>
                    </div>
                </div>
                <div class="actions" id="actionButtons">
                    <!-- Dynamic action buttons will be inserted here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Auto-expanding textarea functionality
        class AutoExpandingTextarea {
            constructor(element) {
                this.element = element;
                this.minHeight = 40;
                this.maxHeight = 200;
                this.init();
            }

            init() {
                this.element.style.minHeight = `${this.minHeight}px`;
                this.element.style.maxHeight = `${this.maxHeight}px`;
                
                // Auto-expand on input
                this.element.addEventListener('input', () => this.autoExpand());
                
                // Initial sizing
                this.autoExpand();
            }

            autoExpand() {
                // Reset height to measure scrollHeight
                this.element.style.height = 'auto';
                
                // Calculate new height
                const newHeight = Math.min(
                    Math.max(this.element.scrollHeight, this.minHeight),
                    this.maxHeight
                );
                
                // Apply new height with animation class
                this.element.classList.add('expanding');
                this.element.style.height = `${newHeight}px`;
                
                // Remove animation class after transition
                setTimeout(() => {
                    this.element.classList.remove('expanding');
                }, 200);
            }

            setValue(value) {
                this.element.value = value;
                this.autoExpand();
            }

            clear() {
                this.element.value = '';
                this.autoExpand();
                this.element.focus();
            }
        }

        // Bujo input handler
        class BujoInputHandler {
            constructor() {
                this.noteInput = document.getElementById('noteInput');
                this.statusIndicator = document.getElementById('statusIndicator');
                this.statusText = document.getElementById('statusText');
                this.modeIndicator = document.getElementById('modeIndicator');
                this.actionButtons = document.getElementById('actionButtons');
                this.feedback = document.getElementById('feedback');
                
                this.autoExpander = new AutoExpandingTextarea(this.noteInput);
                this.undoTimer = null;
                this.lastSavedNote = '';
                
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.updateStatus('ready', 'Ready');
                this.noteInput.focus();
            }

            setupEventListeners() {
                // Keyboard shortcuts
                this.noteInput.addEventListener('keydown', (e) => this.handleKeydown(e));
                
                // Window controls
                document.getElementById('minimizeBtn').addEventListener('click', () => this.hideWindow());
                document.getElementById('closeBtn').addEventListener('click', () => this.closeApp());
                
                // Focus management
                this.noteInput.addEventListener('focus', () => this.updateStatus('ready', 'Ready'));
                this.noteInput.addEventListener('blur', () => this.updateStatus('ready', 'Ready'));
            }

            handleKeydown(e) {
                switch(e.key) {
                    case 'Enter':
                        // Enter: Save note (no newline support)
                        e.preventDefault();
                        this.saveNote();
                        break;
                    
                    case 'Escape':
                        e.preventDefault();
                        this.clearInput();
                        break;
                    
                    case 'z':
                        if (e.ctrlKey && !e.shiftKey) {
                            e.preventDefault();
                            this.undoLastNote();
                        }
                        break;
                }
            }

            async saveNote() {
                const noteText = this.noteInput.value.trim();
                
                if (!noteText) {
                    this.showFeedback('Note cannot be empty', 'error');
                    return;
                }

                this.updateStatus('saving', 'Saving...');
                
                try {
                    // Use IPC to communicate with main process
                    const result = await window.electronAPI.saveNote(noteText);
                    
                    if (result.success) {
                        this.lastSavedNote = noteText;
                        this.autoExpander.clear();
                        this.showFeedback('Note saved!');
                        this.updateStatus('ready', 'Ready');
                        this.showUndoButton();
                    } else {
                        throw new Error(result.error || 'Unknown error');
                    }
                } catch (error) {
                    console.error('Error saving note:', error);
                    this.showFeedback(`Error: ${error.message}`, 'error');
                    this.updateStatus('error', 'Save failed');
                }
            }

            async undoLastNote() {
                if (!this.lastSavedNote) {
                    this.showFeedback('No note to undo', 'error');
                    return;
                }

                try {
                    const result = await window.electronAPI.undoLastNote();
                    
                    if (result.success) {
                        this.autoExpander.setValue(this.lastSavedNote);
                        this.lastSavedNote = '';
                        this.hideUndoButton();
                        this.showFeedback('Note restored for editing');
                        this.updateStatus('ready', 'Ready');
                    } else {
                        throw new Error(result.error || 'Undo failed');
                    }
                } catch (error) {
                    console.error('Error undoing note:', error);
                    this.showFeedback(`Undo error: ${error.message}`, 'error');
                }
            }

            clearInput() {
                this.autoExpander.clear();
                this.showFeedback('Input cleared');
            }

            showUndoButton() {
                // Clear existing undo timer
                if (this.undoTimer) {
                    clearTimeout(this.undoTimer);
                }

                // Create undo button
                const undoBtn = document.createElement('button');
                undoBtn.className = 'action-btn undo-btn';
                undoBtn.id = 'undoBtn';
                undoBtn.innerHTML = '↶ Undo';
                undoBtn.title = 'Undo last entry (Ctrl+Z)';
                undoBtn.addEventListener('click', () => this.undoLastNote());

                // Add to actions
                this.actionButtons.innerHTML = '';
                this.actionButtons.appendChild(undoBtn);

                // Auto-hide after 10 seconds
                this.undoTimer = setTimeout(() => {
                    this.hideUndoButton();
                    this.lastSavedNote = '';
                }, 10000);
            }

            hideUndoButton() {
                if (this.undoTimer) {
                    clearTimeout(this.undoTimer);
                    this.undoTimer = null;
                }
                this.actionButtons.innerHTML = '';
            }

            updateStatus(status, text) {
                this.statusText.textContent = text;
                this.statusIndicator.className = 'status-indicator';
                
                switch(status) {
                    case 'ready':
                        // Green indicator (default)
                        break;
                    case 'saving':
                        this.statusIndicator.classList.add('warning');
                        break;
                    case 'error':
                        this.statusIndicator.classList.add('error');
                        break;
                }
            }

            showFeedback(message, type = 'success') {
                this.feedback.textContent = message;
                this.feedback.className = `feedback ${type}`;
                this.feedback.style.display = 'block';
                
                setTimeout(() => {
                    this.feedback.style.display = 'none';
                }, 2000);
            }

            async hideWindow() {
                try {
                    await window.electronAPI.hideWindow();
                } catch (error) {
                    console.error('Error hiding window:', error);
                }
            }

            async closeApp() {
                try {
                    await window.electronAPI.quitApp();
                } catch (error) {
                    console.error('Error closing app:', error);
                }
            }
        }

        // Initialize when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize the bujo input handler
            window.bujoHandler = new BujoInputHandler();
        });

        // Expose IPC API for main process communication
        window.electronAPI = {
            saveNote: (noteText) => {
                // This will be replaced by proper IPC preload script
                return window.require('electron').ipcRenderer.invoke('save-note', noteText);
            },
            
            undoLastNote: () => {
                return window.require('electron').ipcRenderer.invoke('undo-last-note');
            },
            
            hideWindow: () => {
                return window.require('electron').ipcRenderer.invoke('hide-window');
            },
            
            quitApp: () => {
                return window.require('electron').ipcRenderer.invoke('quit-app');
            }
        };
    </script>
</body>
</html>
